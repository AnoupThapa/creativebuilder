# Fly.io settings for creativebuilder.
# Generated and verified for standard production deployment.

app = "creativebuilder"
primary_region = "ams"

[build]
  # If you are using a custom Dockerfile, uncomment the line below:
  # dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"     # Automatically sleeps when idle to save resources
  auto_start_machines = true      # Wakes up automatically when someone visits the link
  min_machines_running = 0
  processes = ["app"]

  # If your application framework does not have a custom /health route, 
  # this fallback ensures Fly checks the root homepage to confirm it's running.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"                 # Cleaned up: removed conflicting memory_mb entry
