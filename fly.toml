# Fly.io settings for PostForge.
# The app name must be unique across Fly.io — if "postforge-anoup" is taken, change it here
# and use the same name in the setup commands.
app = "postforge-anoup"
primary_region = "sin"            # Singapore: closest to Nepal and Australia ("syd" = Sydney)

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  PORT = "8080"
  TRUST_PROXY = "1"
  BETA_MODE = "true"              # sign-up needs an invite code (private team / friends only)

# permanent disk for the database, uploaded photos and backups
[[mounts]]
  source = "postforge_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on, so scheduled social media posts go out on time even when nobody has the app open.
  # (To save money while you only test, change to: auto_stop_machines = "stop" and min_machines_running = 0)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
