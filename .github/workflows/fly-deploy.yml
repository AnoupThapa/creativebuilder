# Publishes PostForge to Fly.io automatically every time code is pushed to the main branch.
# Needs one GitHub secret: FLY_API_TOKEN (a Fly.io deploy token).
# You can also run it by hand: GitHub -> Actions -> "Publish to Fly.io" -> Run workflow.
name: Publish to Fly.io
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # one server (the database lives on its permanent disk), settings from fly.toml
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
